    const x1=Math.round(x*SC),y1=Math.round(y*SC),x2=Math.round((x+w)*SC),y2=Math.round((y+h)*SC);
    o(x1/SC,y1/SC,Math.max(1,x2-x1)/SC,Math.max(1,y2-y1)/SC);
  };
  g.imageSmoothingEnabled=false;
  return g;
}

function ac(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    const d=NB.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    MG=AC.createGain();MG.gain.value=mvol;MG.connect(AC.destination);
  }catch(e){AC=null;}
}
function tone(a,b,d,ty,v){

  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=ty;o.frequency.setValueAtTime(a,t);o.frequency.exponentialRampToValueAtTime(Math.max(b,20),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
}
function nz(d,v,f){
  if(!AC)return;

  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(fl);fl.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+d);
}

let bgmId=null,bgmStep=0,bgmNext=0;
function mfreq(m){return 440*Math.pow(2,(m-69)/12);}
function bnote(f,t,d,ty,v){
  if(!AC||!MG)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=ty;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0008,t+d);
  o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.02);
}
function bdrum(k,t){
  if(!AC||!MG)return;
  if(k==='k'){
    const o=AC.createOscillator(),g=AC.createGain();
    o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);
    g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);
    o.connect(g);g.connect(MG);o.start(t);o.stop(t+.17);
  }else{
    const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();

    s.connect(f);f.connect(g);g.connect(MG);s.start(t);s.stop(t+.14);

}
function sidx(c){return c==='.'?-1:parseInt(c,36)-0;}
function bgmPlay(id){

function bgmTick(){
  if(!AC||!MG||bgmId===null)return;
  const tr=MUS[bgmId];
  if(!tr)return;
  const now=AC.currentTime,sd=60/tr.bpm/4;
  if(bgmNext<now-.3)bgmNext=now+.06;
  while(bgmNext<now+.14){
    const st=bgmStep,t=bgmNext,s=tr.sc,L=tr.lead.length;
    if(tr.once&&st>=L){bgmId='done';return;}
    const bar=(st>>4)%tr.rt.length,ri=tr.rt[bar];

    const d1=tr.dr[0][st&15],d2=tr.dr[1][st&15];
    if(d1!=='.')bdrum(d1,t);
    if(d2!=='.')bdrum(d2,t);
    bgmNext+=sd;bgmStep++;
  }
}
